[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-watcher"
version = "0.1.0"
description = "Auditoria pessoal de extratos financeiros e contratos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finance-watcher-mcp = "finance_watcher.mcp_server.server:main"
finance-watcher-seed = "finance_watcher.mcp_server.db:seed_main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_watcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
